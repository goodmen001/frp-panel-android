name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: android-app

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Checkout frp-panel source
        uses: actions/checkout@v4
        with:
          # Default: upstream VaalaCat/frp-panel.
          # Fork users: change 'repository' to your fork (e.g. goodmen001/frp-panel).
          repository: VaalaCat/frp-panel
          ref: main
          path: frp-panel-source

      - name: Patch frp-panel for Android cross-compile
        working-directory: frp-panel-source
        run: |
          # utils/pty uses github.com/creack/pty which requires cgo.
          # Exclude it on Android and provide a stub instead.
          sed -i 's|//go:build !windows|//go:build !windows \&\& !android|' utils/pty/pty_other.go
          cat > utils/pty/pty_android.go << 'GOEOF'
          //go:build android

          package pty

          import "errors"

          type Pty struct{}

          func DownloadDependency() error { return nil }

          func Start() (PTYInterface, error) {
              return nil, errors.New("PTY not supported on Android")
          }

          func (p *Pty) Write(p []byte) (n int, err error) { return 0, errors.New("not supported") }
          func (p *Pty) Read(p []byte) (n int, err error)  { return 0, errors.New("not supported") }
          func (p *Pty) Getsize() (uint16, uint16, error)  { return 0, 0, errors.New("not supported") }
          func (p *Pty) Setsize(cols, rows uint32) error   { return errors.New("not supported") }
          func (p *Pty) Close() error                      { return nil }
          GOEOF
          echo "=== Patched utils/pty for Android ==="

      - name: Cross-compile frppc for Android
        working-directory: frp-panel-source
        run: |
          mkdir -p ../android-app/android/app/src/main/assets
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o ../android-app/android/app/src/main/assets/frppc ./cmd/frppc
          echo "=== frppc binary for Android ==="
          file ../android-app/android/app/src/main/assets/frppc
          ls -lh ../android-app/android/app/src/main/assets/frppc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" --sdk_root=$ANDROID_HOME

      - name: Setup Gradle
        working-directory: android-app/android
        run: |
          gradle wrapper --gradle-version=8.9

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Release
        working-directory: android-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ github.run_number }}"
          TAG="v1.0.${VER}"
          REPO="${{ github.repository }}"
          gh release create "$TAG" \
            --repo "$REPO" \
            android/app/build/outputs/apk/debug/*.apk \
            --title "FRP Panel Android v1.0.${VER}" \
            --notes "Build ${VER} from commit ${{ github.sha }}" \
            --target "${{ github.sha }}"
