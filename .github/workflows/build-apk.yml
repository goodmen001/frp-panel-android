name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: android-app

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Checkout fatedier/frp
        uses: actions/checkout@v4
        with:
          repository: fatedier/frp
          ref: v0.65.0
          path: frp-source

      - name: Cross-compile frpc for Android
        working-directory: frp-source
        run: |
          mkdir -p ../android-app/android/app/src/main/assets
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o ../android-app/android/app/src/main/assets/frpc ./cmd/frpc
          echo "=== frpc binary for Android ==="
          file ../android-app/android/app/src/main/assets/frpc
          ls -lh ../android-app/android/app/src/main/assets/frpc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" --sdk_root=$ANDROID_HOME

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-app/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frp-panel-android
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
